<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <title>Comic API 测试</title>
  <style>
    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: monospace;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
    }

    header {
      padding: 16px 24px;
      border-bottom: 1px solid #21262d;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-size: 16px;
      color: #58a6ff;
    }

    .container {
      display: grid;
      grid-template-columns: 280px 1fr;
      height: calc(100vh - 53px);
    }

    .sidebar {
      border-right: 1px solid #21262d;
      overflow-y: auto;
    }

    .endpoint {
      padding: 10px 16px;
      cursor: pointer;
      border-bottom: 1px solid #161b22;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .endpoint:hover {
      background: #161b22;
    }

    .endpoint.active {
      background: #1f2937;
      border-left: 2px solid #58a6ff;
    }

    .method {
      font-size: 11px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 3px;
      min-width: 38px;
      text-align: center;
    }

    .get {
      background: #033a16;
      color: #3fb950;
    }

    .delete {
      background: #3d0000;
      color: #f85149;
    }

    .url {
      color: #8b949e;
    }

    .main {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .toolbar {
      padding: 12px 16px;
      border-bottom: 1px solid #21262d;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #url-input {
      flex: 1;
      background: #161b22;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 6px 10px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 13px;
    }

    #send-btn {
      background: #238636;
      color: #fff;
      border: none;
      padding: 6px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    #send-btn:hover {
      background: #2ea043;
    }

    .response-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .response-meta {
      padding: 8px 16px;
      border-bottom: 1px solid #21262d;
      font-size: 12px;
      color: #8b949e;
      display: flex;
      gap: 16px;
    }

    .status-ok {
      color: #3fb950;
    }

    .status-err {
      color: #f85149;
    }

    #response-body {
      flex: 1;
      overflow: auto;
      padding: 16px;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>

<body>
  <header>
    <h1>Comic API 测试台</h1>
  </header>
  <div class="container">
    <div class="sidebar" id="sidebar"></div>
    <div class="main">
      <div class="toolbar">
        <input id="url-input" value="http://localhost:8888/api/health" />
        <button id="send-btn">发送</button>
      </div>
      <div class="response-area">
        <div class="response-meta">
          <span id="meta-status">—</span>
          <span id="meta-time">—</span>
          <span id="meta-size">—</span>
        </div>
        <div id="response-body">点击左侧接口或直接输入 URL 后发送</div>
      </div>
    </div>
  </div>

  <script>
    const ENDPOINTS = [
      { method: 'GET', url: '/api/health', label: 'Health 检查' },
      { method: 'GET', url: '/api/comics', label: '所有漫画' },
      { method: 'GET', url: '/api/comics/1',          label: '漫画详情' },
      { method: 'GET', url: '/api/chapters/1/images', label: '章节图片' },
      { method: 'DELETE', url: '/api/comics/1', label: '删除漫画' },
    ];

    const sidebar = document.getElementById('sidebar');
    const urlInput = document.getElementById('url-input');
    const sendBtn = document.getElementById('send-btn');
    const body = document.getElementById('response-body');
    const metaStatus = document.getElementById('meta-status');
    const metaTime = document.getElementById('meta-time');
    const metaSize = document.getElementById('meta-size');

    ENDPOINTS.forEach((ep, i) => {
      const el = document.createElement('div');
      el.className = 'endpoint';
      el.innerHTML = `<span class="method ${ep.method.toLowerCase()}">${ep.method}</span><span class="url">${ep.url}</span>`;
      el.title = ep.label;
      el.onclick = () => {
        document.querySelectorAll('.endpoint').forEach(e => e.classList.remove('active'));
        el.classList.add('active');
        urlInput.value = location.origin + ep.url;
        currentMethod = ep.method;
        sendBtn.textContent = ep.method === 'DELETE' ? '删除' : '发送';
        sendBtn.style.background = ep.method === 'DELETE' ? '#b91c1c' : '#238636';
        send();
      };
      sidebar.appendChild(el);
    });

    let currentMethod = 'GET';

    async function send() {
      const url = urlInput.value.trim();
      if (currentMethod === 'DELETE' && !confirm(确定要删除吗？\n)) return;
      body.textContent = '请求中…';
      metaStatus.textContent = '—';
      metaTime.textContent = '—';
      metaSize.textContent = '—';

      const t0 = Date.now();
      try {
        const res = await fetch(url, { method: currentMethod });
        const ms = Date.now() - t0;
        const text = await res.text();
        let display = text;
        try { display = JSON.stringify(JSON.parse(text), null, 2); } catch { }

        metaStatus.textContent = `${res.status} ${res.statusText}`;
        metaStatus.className = res.ok ? 'status-ok' : 'status-err';
        metaTime.textContent = `${ms} ms`;
        metaSize.textContent = `${new Blob([text]).size} B`;
        body.textContent = display;
      } catch (e) {
        body.textContent = `请求失败: ${e}`;
        metaStatus.textContent = 'Error';
        metaStatus.className = 'status-err';
      }
    }

    sendBtn.onclick = send;
    urlInput.addEventListener('keydown', e => e.key === 'Enter' && send());
  </script>
</body>

</html>
