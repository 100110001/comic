<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="/workbench.css" />
    <title>总览 · 漫画后台</title>
  </head>
  <body data-page="overview">
    <script src="/shell.js"></script>
    <main class="dashboard">
      <header class="page-top">
        <div>
          <p class="eyebrow">COMIC / OBSERVATORY</p>
          <h1>运行总览</h1>
          <p class="subtitle">从漫画库到每一次请求，掌握后台此刻的运行情况。</p>
        </div>
        <div class="actions">
          <label
            ><input id="auto-refresh" type="checkbox" checked /> 自动刷新</label
          ><button id="refresh" class="primary">刷新数据 ↻</button>
        </div>
      </header>
      <div id="connection" class="connection-bar" role="status">
        <span id="connection-text">正在获取后台数据…</span
        ><time id="updated"></time>
      </div>
      <div class="section-heading">
        <h2>漫画库概况</h2>
        <small>你的收藏，一目了然</small>
      </div>
      <section
        class="metric-grid"
        id="library-cards"
        aria-label="漫画库统计"
      ></section>
      <div class="status-strip" id="services"></div>
      <div class="section-heading">
        <h2>请求脉搏</h2>
        <a href="/requests.html">查看请求明细 ↗</a>
      </div>
      <section
        class="metric-grid"
        id="traffic-cards"
        aria-label="请求统计"
      ></section>
      <div class="two-col">
        <section class="panel">
          <div class="panel-heading">
            <h2>近期请求趋势</h2>
            <small>最近 15 分钟 · 每分钟</small>
          </div>
          <div id="request-chart"></div>
          <div class="legend">
            <span><i style="background: #91b2ee"></i>普通接口</span
            ><span><i style="background: #c5ccd9"></i>原图请求</span
            ><span><i style="background: #b4a3d3"></i>超分 HTTP</span>
          </div>
          <p class="muted">基于保留的请求明细；较早时间桶可能不完整。</p>
        </section>
        <section class="panel">
          <div class="panel-heading">
            <h2>三类缓存</h2>
            <a href="/requests.html">展开 ↗</a>
          </div>
          <div id="cache-overview"></div>
        </section>
      </div>
      <div class="two-col">
        <section class="panel">
          <div class="panel-heading">
            <h2>最近异常</h2>
            <a href="/requests.html?category=all&status=failed">查看全部 ↗</a>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>类别</th>
                  <th>请求 / 图片</th>
                  <th>结果</th>
                  <th>时间</th>
                </tr>
              </thead>
              <tbody id="recent-errors"></tbody>
            </table>
          </div>
        </section>
        <section class="panel">
          <div class="panel-heading">
            <h2>超分处理</h2>
            <a href="/super-resolution-monitor.html">打开工作台 ↗</a>
          </div>
          <div id="upscale-overview"></div>
        </section>
      </div>
      <p class="footnote" id="scope-note">
        仅统计当前进程，重启后清空；请求明细最多保留 500
        条。看板轮询不计入业务请求。
      </p>
    </main>
    <script src="/dashboard.js" defer></script>
  </body>
</html>
