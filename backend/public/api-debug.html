<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>API 调试 · 漫画后台</title>
    <link rel="stylesheet" href="/admin.css" />
    <style>
      body {
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      .container {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        flex: 1;
        min-height: 0;
      }
      .sidebar {
        background: var(--panel);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .sidebar-head {
        padding: 24px 20px 16px;
      }
      .sidebar-head h2 {
        font-size: 16px;
        margin: 6px 0 14px;
      }
      .sidebar-head input {
        width: 100%;
      }
      .endpoints {
        padding: 0 12px 20px;
        overflow: auto;
      }
      .endpoint {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        width: 100%;
        padding: 13px 12px;
        margin-bottom: 6px;
        background: transparent;
        border-color: transparent;
        text-align: left;
      }
      .endpoint.active {
        background: #243553;
        border-color: #5577ae;
      }
      .endpoint-copy {
        min-width: 0;
      }
      .endpoint strong {
        display: block;
        font-size: 14px;
      }
      .endpoint code {
        display: block;
        color: var(--muted);
        font-size: 14px;
        overflow-wrap: anywhere;
      }
      .method {
        font:
          600 12px/1.5 Consolas,
          monospace;
        border-radius: 5px;
        min-width: 48px;
        text-align: center;
        padding: 3px 6px;
        color: var(--green);
        background: #263248;
        margin-top: 2px;
      }
      .method.delete {
        background: #452730;
        color: var(--red);
      }
      .sidebar-foot {
        margin-top: auto;
        padding: 16px 20px;
        border-top: 1px solid var(--line);
        font-size: 14px;
        color: var(--muted);
      }
      .main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        padding: 28px;
        gap: 20px;
      }
      .heading {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .heading h2 {
        font-size: 24px;
        margin: 0;
      }
      .heading p {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 14px;
      }
      .request-panel {
        padding: 20px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
      }
      .request-panel label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        color: var(--muted);
      }
      .toolbar {
        display: flex;
        gap: 8px;
      }
      .toolbar input {
        flex: 1;
        min-width: 0;
        font-family: Consolas, monospace;
      }
      .request-hint {
        margin: 10px 0 0;
        font-size: 14px;
        color: var(--muted);
      }
      .response-area {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 160px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--panel);
        overflow: hidden;
      }
      .response-head {
        padding: 15px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid var(--line);
      }
      .response-head h3 {
        font-size: 14px;
        margin: 0;
      }
      .response-head button {
        margin-left: auto;
        font-size: 14px;
        padding: 6px 10px;
      }
      .response-meta {
        padding: 12px 20px;
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
        font-size: 14px;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
      }
      .response-meta span {
        display: flex;
        gap: 8px;
      }
      #response-body {
        margin: 0;
        flex: 1;
        overflow: auto;
        padding: 20px;
        font:
          13px/1.75 Consolas,
          "Microsoft YaHei",
          monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .copy-feedback {
        font-size: 14px;
        color: var(--muted);
      }
      .empty {
        padding: 20px;
        color: var(--muted);
        font-size: 14px;
      }
      @media (max-width: 900px) {
        .container {
          grid-template-columns: 240px minmax(0, 1fr);
        }
        .main {
          padding: 20px;
        }
        .toolbar {
          flex-wrap: wrap;
        }
        .toolbar input {
          flex-basis: 60%;
        }
      }
      @media (max-width: 700px) {
        body {
          height: auto;
          min-height: 100dvh;
        }
        .container {
          grid-template-columns: 1fr;
        }
        .sidebar {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .sidebar-head {
          padding: 16px;
        }
        .sidebar-head h2 {
          margin: 0 0 10px;
        }
        .endpoints {
          max-height: 220px;
        }
        .sidebar-foot {
          display: none;
        }
        .main {
          padding: 16px;
          gap: 16px;
        }
        .heading h2 {
          font-size: 21px;
        }
        .request-panel {
          padding: 16px;
        }
        .toolbar input {
          flex-basis: 70%;
          width: 100%;
        }
        .toolbar #send-btn {
          width: 100%;
        }
        .response-area {
          min-height: 320px;
        }
        .response-meta {
          gap: 12px;
        }
        .response-head {
          flex-wrap: wrap;
        }
      }
    </style>
    <link rel="stylesheet" href="/workbench.css" />
  </head>
  <body>
    <script src="/shell.js"></script>
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">C</span>
        <div>
          <h1>漫画后台</h1>
          <p>接口调试与图像处理监视</p>
        </div>
      </div>
      <nav class="page-nav" aria-label="后台导航">
        <a href="/api-debug.html" aria-current="page">API 调试</a
        ><a href="/super-resolution-monitor.html">超分监视</a>
      </nav>
    </header>
    <div class="container">
      <aside class="sidebar" aria-label="接口列表">
        <div class="sidebar-head">
          <div class="eyebrow">接口目录</div>
          <h2>常用接口</h2>
          <input
            id="search"
            type="search"
            placeholder="搜索名称或路径…"
            aria-label="搜索接口"
          />
        </div>
        <div id="sidebar" class="endpoints"></div>
        <div class="sidebar-foot">
          选择接口，编辑地址后发送。<br />示例中的 ID 可替换为实际值。
        </div>
      </aside>
      <main class="main">
        <div class="heading">
          <div>
            <h2>API 调试</h2>
            <p>检查后端响应，快速定位接口问题。</p>
          </div>
          <span class="pill">JSON 格式化</span>
        </div>
        <section class="request-panel" aria-label="请求配置">
          <label for="url-input">请求地址</label>
          <form id="request-form" class="toolbar">
            <select id="method" aria-label="请求方法">
              <option>GET</option>
              <option>POST</option>
              <option>PUT</option>
              <option>DELETE</option></select
            ><input
              id="url-input"
              type="text"
              spellcheck="false"
              required
              aria-label="请求地址"
            /><button id="send-btn" class="primary" type="submit">
              发送请求
            </button>
          </form>
          <div id="body-editor" hidden>
            <label for="request-body">JSON 请求体（无参数时留空）</label>
            <textarea
              id="request-body"
              spellcheck="false"
              aria-describedby="body-error"
            ></textarea>
            <p id="body-error" role="alert"></p>
          </div>
          <p class="request-hint" id="request-hint">
            默认连接当前后端，支持编辑完整 URL 或相对路径。
          </p>
        </section>
        <section class="response-area" aria-labelledby="response-title">
          <div class="response-head">
            <h3 id="response-title">响应结果</h3>
            <span id="copy-feedback" class="copy-feedback" role="status"></span
            ><button id="copy-btn" disabled>复制响应</button>
          </div>
          <div class="response-meta" role="status" aria-live="polite">
            <span>状态 <b id="meta-status">未发送</b></span
            ><span>耗时 <b id="meta-time">—</b></span
            ><span>大小 <b id="meta-size">—</b></span>
          </div>
          <pre id="response-body" tabindex="0" aria-label="响应内容">
选择左侧接口，或输入请求地址后点击「发送请求」。</pre>
        </section>
      </main>
    </div>
    <dialog id="confirm-request" aria-labelledby="confirm-title">
      <h2 id="confirm-title">确认发送请求</h2>
      <p id="confirm-details"></p>
      <form method="dialog" class="actions">
        <button value="cancel" autofocus>取消</button>
        <button value="send" class="danger">确认发送</button>
      </form>
    </dialog>
    <script src="/api-debug.js"></script>
  </body>
</html>
