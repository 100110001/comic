<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>超分监视 · 漫画后台</title>
    <link rel="stylesheet" href="/admin.css" />
    <style>
      header.app-header {
        min-height: 68px;
        padding: 12px 20px;
      }
      body {
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      .monitor-summary {
        padding: 12px 20px;
        display: flex;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      .monitor-summary h2 {
        margin: 0;
        font-size: 20px;
      }
      .monitor-summary p {
        margin: 3px 0;
        color: var(--muted);
        font-size: 12px;
      }
      .stats {
        display: flex;
        gap: 10px;
        margin-left: auto;
      }
      .stat {
        padding: 6px 12px;
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 10px;
        min-width: 84px;
      }
      .stat b {
        display: block;
        font-size: 20px;
        color: #c8d8ff;
      }
      .stat span {
        font-size: 12px;
        color: var(--muted);
      }
      .connection.status-err {
        color: var(--red);
      }
      #refresh {
        min-width: 100px;
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 8px minmax(
            280px,
            var(--preview-width, 360px)
          );
        flex: 1;
        min-height: 0;
      }
      aside {
        min-width: 0;
        min-height: 0;
        background: var(--panel);
        border-right: 0;
        display: flex;
        flex-direction: column;
      }
      .filters {
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .filters input[type="search"] {
        flex: 0 1 360px;
        min-width: 180px;
      }
      .filters label {
        display: flex;
        gap: 6px;
        align-items: center;
        color: var(--muted);
        font-size: 12px;
      }
      .requests {
        overflow: auto;
        flex: 1;
        min-height: 0;
      }
      .request-table {
        width: auto;
        min-width: 0;
        border-collapse: collapse;
        font-size: 12px;
        text-align: left;
      }
      .request-table caption {
        text-align: left;
        padding: 0 16px 8px;
        color: var(--muted);
      }
      .request-table th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: #182335;
        color: var(--muted);
        font-weight: 500;
        white-space: nowrap;
      }
      .request-table th,
      .request-table td {
        padding: 5px 10px;
        border-bottom: 1px solid var(--line);
      }
      .request {
        cursor: pointer;
      }
      .request:hover {
        background: #1c2a40;
      }
      .request.active {
        background: #243553;
      }
      .request.active td:first-child {
        box-shadow: inset 3px 0 var(--accent);
      }
      .request small {
        display: inline-block;
        margin-left: 8px;
        color: var(--muted);
        font-size: 11px;
      }
      .request-select {
        background: transparent;
        border: 0;
        border-radius: 4px;
        padding: 0;
        text-align: left;
        color: var(--text);
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        display: inline-block;
        vertical-align: middle;
      }
      .request-select[aria-pressed="true"] {
        background: transparent;
        color: #d4e0ff;
      }
      .request-table td {
        white-space: nowrap;
      }
      .tag {
        display: inline-block;
        border-radius: 5px;
        padding: 2px 7px;
        background: #273b60;
        color: #b7cbff;
        font-size: 11px;
      }
      .tag.ready {
        background: #1d3c33;
        color: var(--green);
      }
      .tag.failed {
        background: #452730;
        color: var(--red);
      }
      .layout-divider {
        cursor: col-resize;
        touch-action: none;
        background: var(--bg);
        border-left: 1px solid var(--line);
        border-right: 1px solid var(--line);
        position: relative;
      }
      .layout-divider::after {
        content: "";
        position: absolute;
        width: 2px;
        height: 32px;
        background: var(--muted);
        top: 50%;
        left: 2px;
        border-radius: 2px;
      }
      .layout-divider:hover,
      .layout-divider:focus-visible,
      main.resizing .layout-divider {
        background: #2a3d61;
        outline: 0;
      }
      .layout-divider:focus-visible::after {
        background: var(--accent);
      }
      main.resizing {
        user-select: none;
        cursor: col-resize;
      }
      .workspace {
        min-width: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .preview-heading {
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      .preview-heading h2 {
        font-size: 15px;
        margin: 0;
      }
      .preview-heading p {
        color: var(--muted);
        font-size: 12px;
        margin: 3px 0 0;
      }
      .detail {
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      .detail h2 {
        font-size: 14px;
        margin: 0 0 6px;
        overflow-wrap: anywhere;
      }
      .detail p {
        font-size: 12px;
        margin: 0;
        color: var(--muted);
      }
      .tools {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .tools button {
        padding: 5px 8px;
        font-size: 12px;
      }
      .tools label {
        display: flex;
        gap: 8px;
        align-items: center;
        color: var(--muted);
        font-size: 12px;
      }
      .tools select {
        padding: 5px 8px;
        font-size: 12px;
      }
      #progress {
        width: 120px;
      }
      .canvas {
        flex: 1;
        min-height: 140px;
        overflow: auto;
        padding: 16px;
        background: repeating-conic-gradient(#131d2b 0% 25%, #182335 0% 50%)
          50%/20px 20px;
      }
      .stage {
        position: relative;
        margin: auto;
        overflow: hidden;
        background: #fff;
        box-shadow: 0 8px 25px #0004;
      }
      .stage img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .stage .enhanced {
        position: absolute;
        inset: 0;
        clip-path: inset(0 50% 0 0);
      }
      .divider {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 14px;
        left: 50%;
        background: #8daaff55;
        border-left: 2px solid #8daaff;
        cursor: ew-resize;
        touch-action: none;
      }
      .labels {
        position: absolute;
        top: 10px;
        left: 10px;
        right: 10px;
        display: flex;
        justify-content: space-between;
        pointer-events: none;
      }
      .labels span {
        background: #10141bcc;
        color: white;
        border-radius: 5px;
        padding: 3px 7px;
        font-size: 11px;
      }
      .message {
        color: var(--muted);
        padding: 25px;
        text-align: center;
      }
      .notice {
        color: #ffbd89 !important;
        margin-top: 8px !important;
      }
      .notice:empty {
        display: none;
      }
      .links {
        margin-top: 10px;
        display: flex;
        gap: 15px;
      }
      .links a {
        font-size: 12px;
        text-decoration: none;
      }
      .links a:hover {
        text-decoration: underline;
      }
      .footer {
        padding: 10px 20px;
        font-size: 11px;
        line-height: 1.7;
        color: var(--muted);
        background: var(--panel);
        border-top: 1px solid var(--line);
      }
      #empty {
        margin: auto;
        padding: 30px;
        text-align: center;
        color: var(--muted);
        line-height: 2;
      }
      @media (max-width: 1100px) and (min-width: 801px) {
        main {
          grid-template-columns: minmax(0, 1fr) 8px minmax(
              280px,
              var(--preview-width, 320px)
            );
        }
        .filters {
          padding: 14px;
        }
        .request-table th,
        .request-table td {
          padding: 5px 10px;
        }
        .request-table {
          min-width: 0;
        }
      }
      @media (max-width: 800px) {
        .layout-divider {
          display: none;
        }
        body {
          height: auto;
          min-height: 100dvh;
        }
        main {
          grid-template-columns: minmax(0, 1fr);
        }
        .monitor-summary {
          padding: 16px;
          gap: 12px;
        }
        .monitor-summary > div:first-child {
          width: 100%;
        }
        .stats {
          margin-left: 0;
        }
        .stat {
          min-width: 75px;
          padding: 8px 12px;
        }
        .stat b {
          font-size: 21px;
        }
        aside {
          height: 350px;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .filters {
          padding: 14px;
        }
        .workspace {
          min-height: 0;
        }
        .canvas {
          flex: none;
          height: 300px;
        }
        .detail,
        .preview-heading {
          padding: 14px 16px;
        }
        .footer {
          padding: 12px 16px;
        }
        #empty {
          min-height: 180px;
        }
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">C</span>
        <div>
          <h1>漫画后台</h1>
          <p>接口调试与图像处理监视</p>
        </div>
      </div>
      <nav class="page-nav" aria-label="后台导航">
        <a href="/">API 调试</a
        ><a href="/super-resolution-monitor.html" aria-current="page"
          >超分监视</a
        >
      </nav>
    </header>
    <section class="monitor-summary" aria-label="处理概况">
      <div>
        <h2>超分监视</h2>
        <p>观察阅读请求，对照原图与 waifu2x 2× 结果</p>
        <p id="connection" class="connection" role="status">正在连接后端…</p>
      </div>
      <div class="stats">
        <div class="stat"><b id="total">0</b><span>累计请求</span></div>
        <div class="stat"><b id="queued">0</b><span>排队任务</span></div>
        <div class="stat"><b id="running">0</b><span>正在处理</span></div>
      </div>
      <button id="refresh" class="primary">立即刷新</button>
    </section>
    <main>
      <aside>
        <div class="filters">
          <input
            id="search"
            type="search"
            placeholder="搜索文件名或图片 ID"
            aria-label="搜索请求"
          /><select id="filter" aria-label="筛选状态">
            <option value="all">全部状态</option>
            <option value="submitting">提交中</option>
            <option value="queued">排队中</option>
            <option value="running">处理中</option>
            <option value="ready">已完成</option>
            <option value="failed">失败</option></select
          ><label><input id="auto" type="checkbox" checked /> 自动刷新</label>
        </div>
        <div id="request-scroll" class="requests">
          <table class="request-table">
            <caption>
              最近请求 · 点击文件名查看对比
            </caption>
            <thead>
              <tr>
                <th scope="col">序号</th>
                <th scope="col">文件 / 图片 ID</th>
                <th scope="col">状态</th>
                <th scope="col">处理类型</th>
                <th scope="col">耗时</th>
                <th scope="col">请求时间</th>
              </tr>
            </thead>
            <tbody id="requests"></tbody>
          </table>
        </div>
      </aside>
      <div
        id="layout-divider"
        class="layout-divider"
        role="separator"
        tabindex="0"
        aria-label="调整请求列表与图片预览宽度"
        aria-orientation="vertical"
        aria-valuemin="320"
        aria-valuenow="320"
        aria-valuemax="320"
        title="拖动调整宽度；方向键微调"
      ></div>
      <section class="workspace" aria-label="图片预览">
        <div class="preview-heading">
          <h2>图片对比</h2>
          <p>选择表格中的请求，预览原图与超分结果。</p>
        </div>
        <div id="empty">
          从请求表格选择一行，查看图片对比。<br />在阅读器开启超分后，请求会自动出现在这里。
        </div>
        <div id="detail" class="detail" hidden>
          <h2 id="filename"></h2>
          <p id="meta"></p>
          <p id="error" class="notice" role="status"></p>
          <div class="tools">
            <button id="compare">拖动对比</button
            ><button id="original">原图</button
            ><button id="enhanced">超分图</button
            ><label
              >分割位置
              <input
                id="progress"
                type="range"
                min="0"
                max="100"
                value="50" /></label
            ><label
              >缩放
              <select id="zoom">
                <option value="fit">适应窗口</option>
                <option value="1">原图 100%</option>
                <option value="2">原图 200%</option>
                <option value="4">原图 400%</option>
              </select></label
            >
          </div>
          <div class="links">
            <a id="originalLink" target="_blank" rel="noopener">打开原图</a
            ><a id="enhancedLink" target="_blank" rel="noopener">打开超分图</a>
          </div>
        </div>
        <div id="canvas" class="canvas" hidden>
          <div id="stage" class="stage">
            <img id="base" alt="原图" />
            <div id="layer" class="enhanced">
              <img id="upscaled" alt="超分图" />
            </div>
            <div id="divider" class="divider"></div>
            <div class="labels">
              <span id="leftLabel">超分 2×</span
              ><span id="rightLabel">原图</span>
            </div>
          </div>
        </div>
        <div class="footer">
          记录最近 500
          次超分提交，累计数覆盖本次运行；后端重启后清空。状态表示历史处理结果，缓存可能失效；原图为当前文件，不保存历史快照。
        </div>
      </section>
    </main>
    <script>
      "use strict";
      const $ = (id) => document.getElementById(id);
      const names = {
        submitting: "提交中",
        queued: "排队中",
        running: "处理中",
        ready: "已完成",
        failed: "失败",
      };
      const kinds = {
        cache: "缓存命中",
        shared: "共享任务",
        inference: "新建处理",
      };
      let records = [],
        selected = null,
        signature = "",
        mode = "compare",
        available = false,
        busy = false;
      const text = (id, value) => {
        $(id).textContent = value;
      };
      function safeUrl(value) {
        if (!value) return null;
        try {
          const url = new URL(value, location.origin);
          if (
            url.origin !== location.origin ||
            (!url.pathname.startsWith("/static/") &&
              !url.pathname.startsWith("/api/super-resolution/files/"))
          )
            return null;
          return url.href;
        } catch {
          return null;
        }
      }
      function list() {
        const focused = document.activeElement?.closest(".request")?.dataset.id;
        const scroll = $("request-scroll").scrollTop;
        const query = $("search").value.trim().toLowerCase();
        const visible = records.filter(
          (r) =>
            ($("filter").value === "all" || r.status === $("filter").value) &&
            `${r.filename} ${r.imageId}`.toLowerCase().includes(query),
        );
        const fragment = document.createDocumentFragment();
        for (const record of visible) {
          const row = document.createElement("tr");
          row.className = "request" + (record.id === selected ? " active" : "");
          row.dataset.id = String(record.id);
          const cell = (value) => {
            const td = document.createElement("td");
            td.textContent = value;
            row.append(td);
            return td;
          };
          cell("#" + record.id);
          const file = cell("");
          const button = document.createElement("button");
          button.className = "request-select";
          button.textContent = record.filename;
          button.title = record.filename;
          button.setAttribute("aria-pressed", String(record.id === selected));
          const image = document.createElement("small");
          image.textContent = "图片 " + record.imageId;
          file.append(button, image);
          const status = cell("");
          const tag = document.createElement("span");
          tag.className = "tag " + record.status;
          tag.textContent = names[record.status] || record.status;
          status.append(tag);
          cell(
            kinds[record.kind] ||
              (record.status === "failed" ? "提交失败" : "正在提交"),
          );
          cell((record.elapsedMs / 1000).toFixed(2) + " 秒");
          cell(new Date(record.requestedAt).toLocaleTimeString());
          row.onclick = () => {
            selected = record.id;
            signature = "";
            list();
            detail();
          };
          fragment.append(row);
        }
        if (!visible.length) {
          const row = document.createElement("tr");
          const message = document.createElement("td");
          message.colSpan = 6;
          message.className = "message";
          message.textContent = records.length
            ? "没有匹配的请求"
            : "尚无超分请求。在阅读器开启超分后可观察处理过程。";
          row.append(message);
          fragment.append(row);
        }
        $("requests").replaceChildren(fragment);
        $("request-scroll").scrollTop = scroll;
        if (focused) {
          const target = Array.from($("requests").children).find(
            (row) => row.dataset.id === focused,
          );
          target?.querySelector("button")?.focus({ preventScroll: true });
        }
      }
      function size() {
        const base = $("base");
        if (!base.naturalWidth) return;
        const factor = $("zoom").value;
        const width =
          factor === "fit"
            ? Math.max(
                1,
                Math.min(
                  $("canvas").clientWidth - 32,
                  (($("canvas").clientHeight - 32) * base.naturalWidth) /
                    base.naturalHeight,
                ),
              )
            : base.naturalWidth * Number(factor);
        $("stage").style.width = width + "px";
        $("stage").style.height =
          (width * base.naturalHeight) / base.naturalWidth + "px";
      }
      function view() {
        for (const name of ["original", "enhanced", "compare"])
          $(name).setAttribute("aria-pressed", String(mode === name));
        const split = Number($("progress").value);
        $("layer").hidden = !available || mode === "original";
        $("divider").hidden = !available || mode !== "compare";
        $("layer").style.clipPath =
          mode === "enhanced" ? "none" : `inset(0 ${100 - split}% 0 0)`;
        $("divider").style.left = split + "%";
        $("leftLabel").textContent =
          available && mode !== "original" ? "超分 2×" : "原图";
        $("rightLabel").hidden = !available || mode !== "compare";
        $("progress").disabled = !available || mode !== "compare";
        $("compare").disabled = !available;
        $("enhanced").disabled = !available;
      }
      function detail() {
        const r = records.find((item) => item.id === selected);
        if (!r) {
          if (selected !== null) {
            selected = null;
            signature = "";
          }
          $("empty").hidden = false;
          $("detail").hidden = true;
          $("canvas").hidden = true;
          return;
        }
        text("filename", `#${r.id} · ${r.filename}`);
        text(
          "meta",
          `图片 ${r.imageId} · ${names[r.status] || r.status} · ${kinds[r.kind] || (r.status === "failed" ? "提交失败" : "提交中")} · ${(r.elapsedMs / 1000).toFixed(2)} 秒 · ${r.width && r.height ? `${r.width} × ${r.height} → ${r.width * 2} × ${r.height * 2}` : "尺寸待确认"}`,
        );
        const next = `${r.id}:${r.status}:${r.url || ""}:${r.originalUrl || ""}`;
        if (next === signature) return;
        signature = next;
        $("empty").hidden = true;
        $("detail").hidden = false;
        $("canvas").hidden = false;
        text(
          "error",
          r.error ||
            (["queued", "running", "submitting"].includes(r.status)
              ? "先显示原图，超分完成后自动提供对比。"
              : ""),
        );
        const original = safeUrl(r.originalUrl),
          enhanced = r.status === "ready" ? safeUrl(r.url) : null;
        available = false;
        view();
        $("originalLink").hidden = !original;
        $("enhancedLink").hidden = !enhanced;
        if (original) {
          $("originalLink").href = original;
          $("base").src = original;
        } else {
          $("base").removeAttribute("src");
          text("error", "原图地址不可用");
        }
        if (enhanced) {
          $("enhancedLink").href = enhanced;
          $("upscaled").src = enhanced;
        } else {
          $("upscaled").removeAttribute("src");
        }
      }
      $("base").onload = size;
      $("base").onerror = () =>
        text("error", "原图无法加载，可能已替换或移除。");
      $("upscaled").onload = () => {
        const r = records.find((item) => item.id === selected);
        if (!r || $("upscaled").currentSrc !== safeUrl(r.url)) return;
        available = true;
        view();
      };
      $("upscaled").onerror = () => {
        available = false;
        view();
        text("error", "超分图无法加载，缓存可能已清理；原图仍可查看。");
      };
      for (const name of ["original", "enhanced", "compare"])
        $(name).onclick = () => {
          mode = name;
          view();
        };
      $("progress").oninput = view;
      let dragging = false;
      function drag(event) {
        if (!dragging) return;
        const bounds = $("stage").getBoundingClientRect();
        $("progress").value = Math.max(
          0,
          Math.min(100, ((event.clientX - bounds.left) / bounds.width) * 100),
        );
        view();
      }
      $("divider").onpointerdown = (event) => {
        dragging = true;
        $("divider").setPointerCapture(event.pointerId);
        drag(event);
      };
      $("divider").onpointermove = drag;
      $("divider").onpointerup = () => {
        dragging = false;
      };
      $("divider").onpointercancel = () => {
        dragging = false;
      };
      $("zoom").onchange = size;
      const layout = document.querySelector("main");
      const splitter = $("layout-divider");
      const workspace = document.querySelector(".workspace");
      const desktop = window.matchMedia("(min-width: 801px)");
      let resizing = null;
      function resizePreview(width) {
        if (!desktop.matches) return;
        const maximum = Math.max(280, layout.clientWidth - 328);
        const preview = Math.max(280, Math.min(maximum, width));
        layout.style.setProperty("--preview-width", preview + "px");
        const listWidth = Math.round(layout.clientWidth - 8 - preview);
        splitter.setAttribute("aria-valuemin", "320");
        splitter.setAttribute(
          "aria-valuemax",
          String(Math.round(layout.clientWidth - 288)),
        );
        splitter.setAttribute("aria-valuenow", String(listWidth));
        splitter.setAttribute(
          "aria-valuetext",
          `请求列表 ${listWidth} 像素，图片预览 ${Math.round(preview)} 像素`,
        );
      }
      splitter.onpointerdown = (event) => {
        if (event.button !== 0 || !desktop.matches) return;
        resizing = {
          x: event.clientX,
          width: workspace.getBoundingClientRect().width,
        };
        splitter.setPointerCapture(event.pointerId);
        layout.classList.add("resizing");
        splitter.focus({ preventScroll: true });
      };
      splitter.onpointermove = (event) => {
        if (resizing)
          resizePreview(resizing.width + resizing.x - event.clientX);
      };
      const stopResizing = () => {
        resizing = null;
        layout.classList.remove("resizing");
      };
      splitter.onpointerup = stopResizing;
      splitter.onpointercancel = stopResizing;
      splitter.onlostpointercapture = stopResizing;
      splitter.onkeydown = (event) => {
        const width = workspace.getBoundingClientRect().width;
        const widths = {
          ArrowLeft: width + 24,
          ArrowRight: width - 24,
          Home: layout.clientWidth - 328,
          End: 280,
        };
        if (event.key in widths) {
          event.preventDefault();
          resizePreview(widths[event.key]);
        }
      };
      window.addEventListener("resize", () => {
        stopResizing();
        resizePreview(workspace.getBoundingClientRect().width);
        size();
      });
      resizePreview(workspace.getBoundingClientRect().width);
      new ResizeObserver(size).observe($("canvas"));
      $("search").oninput = list;
      $("filter").onchange = list;
      async function refresh() {
        if (busy) return;
        busy = true;
        $("refresh").disabled = true;
        text("refresh", "刷新中…");
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 10000);
        try {
          const response = await fetch("/api/super-resolution/monitor", {
            cache: "no-store",
            signal: controller.signal,
          });
          if (!response.ok) throw Error("HTTP " + response.status);
          const json = await response.json();
          if (json.code !== 0 || !Array.isArray(json.data?.requests))
            throw Error("监视接口响应异常");
          records = json.data.requests;
          $("connection").classList.remove("status-err");
          text("total", json.data.total);
          text("queued", json.data.queued);
          text("running", json.data.running);
          text(
            "connection",
            `${json.data.enabled ? "后端超分已启用" : "后端超分已禁用"} · ${new Date().toLocaleTimeString()} 更新 · 保留最近 ${json.data.limit} 条`,
          );
          if (selected === null && records.length) selected = records[0].id;
          list();
          detail();
        } catch (error) {
          $("connection").classList.add("status-err");
          text(
            "connection",
            (error.name === "AbortError"
              ? "刷新超时"
              : "刷新失败：" + error.message) +
              "，保留上次数据，请检查后端后重试。",
          );
        } finally {
          clearTimeout(timeout);
          busy = false;
          $("refresh").disabled = false;
          text("refresh", "立即刷新");
        }
      }
      $("auto").onchange = () => {
        if ($("auto").checked) refresh();
      };
      $("refresh").onclick = refresh;
      setInterval(() => {
        if ($("auto").checked && !document.hidden) refresh();
      }, 2000);
      refresh();
    </script>
  </body>
</html>
