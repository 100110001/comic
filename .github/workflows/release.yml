name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-and-upload:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Build Android APK
        run: flutter build apk --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: ISCC installer.iss

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" installer/comic-setup.exe build/app/outputs/flutter-apk/app-release.apk --title "${{ github.ref_name }}" || gh release upload "${{ github.ref_name }}" installer/comic-setup.exe build/app/outputs/flutter-apk/app-release.apk --clobber
