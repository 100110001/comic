name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-and-upload:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Restore Android signing key
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "缺少签名 Secret：$name；参见 docs/android-signing.md"
            }
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'comic-release.jks'
          [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          "ANDROID_KEYSTORE_PATH=$keyPath" >> $env:GITHUB_ENV

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.9
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Remove Android signing key
        if: always()
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'comic-release.jks'
          if (Test-Path -LiteralPath $keyPath) { Remove-Item -LiteralPath $keyPath -Force }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: ISCC installer.iss

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" installer/comic-setup.exe build/app/outputs/flutter-apk/app-release.apk --title "${{ github.ref_name }}" || gh release upload "${{ github.ref_name }}" installer/comic-setup.exe build/app/outputs/flutter-apk/app-release.apk --clobber
